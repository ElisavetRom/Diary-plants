<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | PlantDiary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">🌿</div>
                <h1>PlantDiary</h1>
                <p>Дневник ухода за растениями</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login"> Вход</button>
                <button class="auth-tab" data-tab="register"> Регистрация</button>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label> Email</label>
                    <input type="email" id="loginEmail" placeholder="demo@plantdiary.com" required>
                </div>
                <div class="form-group">
                    <label> Пароль</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">🌱 Войти в дневник</button>
            </form>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label> Имя</label>
                    <input type="text" id="regName" placeholder="Анна" required>
                </div>
                <div class="form-group">
                    <label> Email</label>
                    <input type="email" id="regEmail" placeholder="anna@plantlover.ru" required>
                </div>
                <div class="form-group">
                    <label> Пароль</label>
                    <input type="password" id="regPassword" placeholder="минимум 6 символов" required>
                </div>
                <div class="form-group">
                    <label> Подтверждение пароля</label>
                    <input type="password" id="regConfirmPassword" placeholder="повторите пароль" required>
                </div>
                <button type="submit" class="auth-btn">🌱 Создать аккаунт</button>
            </form>

        </div>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
