<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Мои растения | PlantDiary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/components.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar__brand">
                <span class="navbar__logo-icon">🌿</span>
                <span class="navbar__logo-text">PlantDiary</span>
            </div>
            <div class="navbar__links">
                <a href="dashboard.html" class="navbar__link">🏠 Главная</a>
                <a href="myplants.html" class="navbar__link navbar__link--active">🌱 Мои растения</a>
                <a href="addplant.html" class="navbar__link">➕ Добавить</a>
                <a href="calendar.html" class="navbar__link">📅 Календарь</a>
                <a href="profile.html" class="navbar__link">👤 Профиль</a>
                <a href="#" id="logoutBtn" class="navbar__link navbar__link--logout">🚪 Выйти</a>
            </div>
        </nav>

        <div class="page-header"><h1>🌱 Мои растения</h1><p>Здесь собраны все твои зелёные друзья</p></div>

        <div class="filters-bar">
            <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Поиск по названию..." class="search-input"></div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="need-water">Требуют полива</button>
                <button class="filter-btn" data-filter="healthy">Здоровые</button>
            </div>
        </div>

        <div id="plantsGrid" class="plants-grid"></div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">🌿</div>
            <h3>У тебя пока нет растений</h3>
            <p>Добавь своё первое растение, чтобы начать уход за ним</p>
            <a href="addplant.html" class="button button--primary">➕ Добавить растение</a>
        </div>

        <!-- <footer><p>🌻 Всего растений: <span id="plantsCount">0</span></p></footer> -->
    </div>

    <script type="module" src="JS/pages/myplants.js"></script>
</body>
</html>
